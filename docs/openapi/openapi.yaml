components:
  securitySchemes:
    musicUCookie:
      type: apiKey
      in: cookie
      name: MUSIC_U
      description: Web session cookie. Do not mix it with eapi/client-only identities.
    csrfToken:
      type: apiKey
      in: query
      name: csrf_token
      description: Value of the `__csrf` cookie, also embedded in the request body.
