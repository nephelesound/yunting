openapi: 3.1.0
info:
  title: Yunting — NetEase Cloud Music backend contract
  version: 0.1.0
  description: |
    Language-independent contract for the NetEase Cloud Music endpoints used by
    Yunting. The C++ implementation is `src/sdk/`; this document adds no runtime
    code and is not a code-generation source for a second client stack.

    Scope: the social and remaining backend surfaces in `docs/API-REMAINING.md`.
    Listen Together and Messaging are complete first.

    Transport:
    - Reads accept plain `GET /api/<path>`.
    - Writes prefer `POST /weapi/<path>` (AES-128-CBC twice + RSA, `params` /
      `encSecKey`, `csrf_token`). Several social writes also accept a plain
      `POST /api/<path>` form; `x-transport` records the endpoint family.
    - Requests never use `/eapi` or `/xeapi`.

    A response is successful only when `code` is `200`. `301` is a missing or
    expired session; `250`/`405`/`-460` are risk control/rate limits; `488` is a
    closed Listen Together room.
  contact:
    name: Yunting
    url: https://github.com/nephelesound/yunting
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: https://music.163.com
    description: Web session host (`MUSIC_U` + `__csrf`).
tags:
  - name: ListenTogether
    description: Room lifecycle, playback sync, invitations and in-room social data.
  - name: Messaging
    description: Private messages, conversations and invitation cards.
  - name: Social
    description: Events, topics and friend presence.
  - name: Comments
    description: Read, like, hug/report and delete comment actions.
  - name: Playlists
    description: Privacy, cover and import writes.
  - name: Cloud
    description: Cloud upload/import/delete.
  - name: Account
    description: Login, profile, avatar and VIP.
  - name: Search
    description: Hot searches.
  - name: Lyrics
    description: Lyric excerpts.
security:
  - musicUCookie: []
    csrfToken: []
