listEvents:
  post:
    operationId: listEvents
    tags: [Social]
    summary: Read the signed-in account's event feed
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: weapi
    requestBody:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/social.yaml#/EventListRequest'
    responses:
      '200':
        description: Event page.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/social.yaml#/EventPageResponse'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

getUserEvents:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: integer
        format: int64
  post:
    operationId: getUserEvents
    tags: [Social]
    summary: Read one user's public event feed
    security:
      - {}
      - musicUCookie: []
    x-transport: api
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/social.yaml#/UserEventRequest'
    responses:
      '200':
        description: Event page; private accounts return an empty list.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/social.yaml#/EventPageResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

forwardEvent:
  post:
    operationId: forwardEvent
    tags: [Social]
    summary: Forward someone's event
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: api
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/social.yaml#/ForwardEventRequest'
    responses:
      '200':
        description: Forwarded.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ActionResult'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '405':
        $ref: '../components/responses.yaml#/RateLimited'

