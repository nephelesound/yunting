createRoom:
  post:
    operationId: createListenTogetherRoom
    tags: [ListenTogether]
    summary: Create a listen-together room
    description: Creates the caller's room. The room id is a string and must stay a string.
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: api
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/listen-together.yaml#/RoomCreateRequest'
    responses:
      '200':
        description: Room created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/listen-together.yaml#/RoomCreateResponse'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '405':
        $ref: '../components/responses.yaml#/RateLimited'

checkRoom:
  post:
    operationId: checkListenTogetherRoom
    tags: [ListenTogether]
    summary: Check whether a room can be joined
    description: Call before accepting an invitation so a full/expired room shows the server's copywriting.
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: api
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/listen-together.yaml#/RoomCheckRequest'
    responses:
      '200':
        description: Joinability result.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/listen-together.yaml#/RoomCheckResponse'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

