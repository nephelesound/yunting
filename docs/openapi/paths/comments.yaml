getComments:
  parameters:
    - name: threadId
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: getComments
    tags: [Comments]
    summary: Read a comment thread
    security:
      - {}
      - musicUCookie: []
    x-transport: weapi
    requestBody:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/comments.yaml#/CommentsRequest'
    responses:
      '200':
        description: Comment page.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/comments.yaml#/CommentPageResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

