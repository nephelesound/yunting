setPrivacy:
  post:
    operationId: setPlaylistPrivacy
    tags: [Playlists]
    summary: Set a playlist public/private
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: weapi
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/playlists.yaml#/SetPlaylistPrivacyRequest'
    responses:
      '200':
        description: Privacy changed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ActionResult'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '405':
        $ref: '../components/responses.yaml#/RateLimited'

