updateProfile:
  post:
    operationId: updateProfile
    tags: [Account]
    summary: Edit the signed-in profile
    security:
      - musicUCookie: []
        csrfToken: []
    x-transport: weapi
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/account.yaml#/UpdateProfileRequest'
    responses:
      '200':
        description: Profile updated.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ActionResult'
      '301':
        $ref: '../components/responses.yaml#/NotLoggedIn'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

