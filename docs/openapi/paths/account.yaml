loginCellphone:
  post:
    operationId: loginWithCellphone
    tags: [Account]
    summary: Sign in with a phone number and password or captcha
    security: []
    x-transport: weapi
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/account.yaml#/LoginCellphoneRequest'
    responses:
      '200':
        description: Session established.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/account.yaml#/LoginResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '405':
        $ref: '../components/responses.yaml#/RateLimited'

loginEmail:
  post:
    operationId: loginWithEmail
    tags: [Account]
    summary: Sign in with an email and password
    security: []
    x-transport: weapi
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../components/schemas/account.yaml#/LoginEmailRequest'
    responses:
      '200':
        description: Session established.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/account.yaml#/LoginResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '405':
        $ref: '../components/responses.yaml#/RateLimited'

