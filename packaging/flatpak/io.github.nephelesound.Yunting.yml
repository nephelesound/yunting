# 云听的 Flatpak：所有发行版通用。KDE 运行时已带 Kirigami、Kirigami Addons、Prison、KStatusNotifierItem、
# OpenSSL 与 ffmpeg；这里只补运行时没有的 qtkeychain、libsecret 一套、layer-shell-qt 与 mpv 一套
#（照 Flathub 上 Haruna 的写法）。
# 本地构建：flatpak-builder --user --install --force-clean build/flatpak packaging/flatpak/io.github.nephelesound.Yunting.yml
app-id: io.github.nephelesound.Yunting
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: yunting
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # MPRIS：服务名是 org.mpris.MediaPlayer2.<applicationName>
  - --own-name=org.mpris.MediaPlayer2.yunting
  # 登录凭据由 libsecret 经 org.freedesktop.portal.Secret 存在应用自己的钥匙环里，
  # 不再直连 org.freedesktop.secrets 或 kwalletd6。
  # 托盘与托盘通知
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # 放歌时不自动睡眠、看 MV 时屏幕常亮：走 org.freedesktop.portal.Inhibit，不需要电源服务的直连权限
  # 系统睡眠前暂停（src/systemsleep.cpp）：收 logind 的 PrepareForSleep 信号。没有这条也能在醒来后
  # 恢复（由时钟发现），只是睡前不会先停下
  - --system-talk-name=org.freedesktop.login1
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  # QtKeychain 的 libsecret 后端：沙箱里 libsecret 的简单 API 自动改走
  # org.freedesktop.portal.Secret + 应用自己的钥匙环，不再需要直连宿主 Secret Service。
  # libsecret 的本地钥匙环文件要加密，所以带上 libgcrypt。
  - name: libgpg-error
    buildsystem: autotools
    config-opts:
      - --disable-doc
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.55.tar.bz2
        sha256: 95b178148863f07d45df0cea67e880a79b9ef71f5d230baddc0071128516ef78

  - name: libgcrypt
    buildsystem: autotools
    config-opts:
      - --disable-doc
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-1.11.1.tar.bz2
        sha256: 24e91c9123a46c54e8371f3a3a2502f1198f2893fbfbf59af95bc1c21499b00e

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dcrypto=libgcrypt
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TRANSLATIONS=NO
      - -DLIBSECRET_SUPPORT=ON
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/0.17.0.tar.gz
        sha256: 3b85c3929034b0a99da777130c34d99f006fcd3a9d56564159399a33fee0e504

  # Wayland 下的桌面歌词置顶
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.8.0/layer-shell-qt-6.8.0.tar.xz
        sha256: 91ced561862f0d84836ad4ae5c34914bb532576c88607baf4ec2c957b895b41d

  - name: mpvqt
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.kde.org/stable/mpvqt/mpvqt-1.2.0.tar.xz
        sha256: 8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb
    modules:
      # 只要 libmpv：不要 mpv 播放器本体、脚本与手册
      - name: libmpv
        buildsystem: meson
        config-opts:
          - -Dlibmpv=true
          - -Dcplayer=false
          - -Dlua=disabled
          - -Djavascript=disabled
          - -Dalsa=disabled
          - -Dmanpage-build=disabled
          - -Dbuild-date=false
        cleanup:
          - /share
        sources:
          - type: archive
            url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
            sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
        modules:
          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Ddemos=false
            sources:
              - type: git
                url: https://github.com/haasn/libplacebo.git
                tag: v7.360.1
                commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
          - name: libass
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz
                sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: yunting
    buildsystem: cmake-ninja
    subdir: src
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - .flatpak-builder
          - docs/reference
          - packaging/aur/pkg
          - packaging/aur/src
          - packaging/aur/yunting
